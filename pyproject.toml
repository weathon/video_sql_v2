[project]
name = "video-sql-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "diskcache>=5.6.3",
    "duckdb",
    "httpx",
    "httpx2>=2.12.0",
    "numpy",
    "openai",
    "openai-agents",
    "openpyxl>=3.1.5",
    "pillow",
    "pydantic",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlglot>=30.18.0",
    "tqdm>=4.70.0",
    "wandb",
    "weave",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

