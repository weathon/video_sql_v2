[project]
name = "video-sql-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "httpx",
    "numpy",
    "openai",
    "openai-agents",
    "pillow",
    "pydantic",
    "python-dotenv",
    "wandb",
    "weave",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

